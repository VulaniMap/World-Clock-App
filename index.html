<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World clock</title>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>World Clock App</h1>
      <form>
        <select>
          <option value="">Select a city</option>
          <option value="Asia/Tokyo">Tokyo 🇯🇵</option>
          <option value="Australia/Sydney">Sydney 🇦🇺</option>
          <option value="Africa/Pretoria">Pretoria 🇿🇦</option>
        </select>
      </form>
      <div class="city" id="Tokyo">
        <div class="city1">
          <h2>Tokyo 🗼</h2>
          <div class="date"></div>
        </div>
        <div class="time"></div>
      </div>
      <div class="city" id="Pretoria">
        <div>
          <h2>Pretoria</h2>
          <div class="date"></div>
        </div>
        <div class="time"></div>
      </div>

      <script src="src/index.js"></script>
    </div>
    <footer>
      This project was coded by
      <a href="https://github.com/VulaniMap" target="_blank"
        ><strong>Vulani Mapiyeye</strong></a
      >, is open sourced on
      <a href="https://github.com/VulaniMap/World-Clock-App" target="_blank"
        >GitHub</a
      >
      and hosted on
      <a href="https://world-clock-app-h3st.onrender.com" target="_blank"
        >Render</a
      >.
    </footer>
  </body>
</html>
